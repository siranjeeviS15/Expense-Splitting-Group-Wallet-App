services:
  - type: web
    name: expense-splitting-group-wallet
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DATABASE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: expense-splitting-group-wallet-db
          property: connectionString
databases:
  - name: expense-splitting-group-wallet-db
    plan: free
    region: singapore
    databaseName: expense_splitting
    user: expense_splitting_user
